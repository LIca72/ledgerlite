services:
  db:
    image: postgres:16
    ports:
      - "5432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5


  wallet-service:
    build: ./wallet-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      PROVIDER_BASE_URL: http://provider-mock:8001
      WALLET_BASE_URL: http://wallet-service:8000
    depends_on:
      db:
        condition: service_healthy
      provider-mock:
        condition: service_started
    command: >
      sh -c "python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"

  provider-mock:
    build: ./provider-mock
    ports:
      - "8001:8001"
    env_file:
      - .env

volumes:
  postgres_data: